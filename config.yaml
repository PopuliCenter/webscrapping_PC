# ============================================================
#  Konfigurasi monitoring  (Drone-Emprit style)
#  Edit kata kunci & sumber di sini, kode tidak perlu disentuh.
# ============================================================

# Kata kunci yang dipantau. Dipakai untuk filter & query GDELT.
# Cocokkan case-insensitive terhadap judul + isi.
keywords:
  - "AS"
  - "Amerika Serikat"
  - "Iran"
  - "Selat Hormuz"

# Bahasa target untuk filter (kosongkan untuk semua).
language: "id"

# ── Sumber NEWS ──────────────────────────────────────────────
news:
  # RSS feed media Indonesia (gratis, stabil).
  rss_feeds:
    - "https://www.antaranews.com/rss/terkini.xml"
    - "https://rss.tempo.co/nasional"
    - "https://www.cnnindonesia.com/nasional/rss"
    - "https://www.republika.co.id/rss"
    - "https://news.detik.com/berita/rss"
    - "https://www.cnnindonesia.com/internasional/rss"
    - "https://news.detik.com/internasional/rss"
    - "https://rss.tempo.co/dunia"
    - "https://www.republika.co.id/rss/internasional"

  # GDELT Doc API (gratis, tanpa key). Cari berita global per kata kunci.
  gdelt:
    enabled: true
    timespan: "1d"        # rentang waktu tiap tarik: 15min, 1h, 1d, 1w...
    max_records: 75       # maksimum 250 per query

  # Ambil teks artikel penuh (lambat). Bila false / gagal -> pakai ringkasan RSS.
  fetch_full_text: true

# ── Sumber X / TWITTER (Fase 2) ──────────────────────────────
x:
  enabled: true
  method: "auto"          # twikit | service | auto (twikit dulu, fallback service)
  search_queries: []   # query pencarian X (boleh beda dari keyword global)
  tweets_per_query: 50
  product: "Latest"       # Latest | Top
  daily_limit: 300        # maks tweet per HARI (0 = tanpa batas)
  quota_file: "data/kuota_harian.json"    # catatan pemakaian harian

  # Jalur GRATIS (login akun) — isi kredensial di file secrets terpisah.
  twikit:
    accounts_file: "secrets/x_accounts.yaml"
    cookies_dir: "data/x_cookies"
    min_delay_sec: 5      # jeda acak antar request (anti-limit)
    max_delay_sec: 12
    cooldown_minutes: 15  # akun yang kena limit diistirahatkan sekian menit
    cooldown_file: "data/x_cooldown.json"   # catatan istirahat (tahan restart)

  # Jalur BERBAYAR (fallback stabil) — token di environment variable.
  service:
    provider: "apify"
    api_token_env: "APIFY_TOKEN"
    actor: "apidojo~tweet-scraper"
    input: {}             # opsi tambahan khusus actor (opsional)

# ── Sumber INSTAGRAM (Fase 4) ────────────────────────────────
instagram:
  enabled: false          # nyalakan setelah isi secrets/ig_accounts.yaml
  hashtags: []
  posts_per_tag: 30
  accounts_file: "secrets/ig_accounts.yaml"
  cookies_dir: "data/ig_sessions"
  min_delay_sec: 8        # jeda besar = lebih aman (IG agresif)
  max_delay_sec: 20
  cooldown_minutes: 60    # akun yang dibatasi IG diistirahatkan sejam (IG galak)
  cooldown_file: "data/ig_cooldown.json"
  daily_limit: 100        # maks post per HARI (0 = tanpa batas)
  quota_file: "data/kuota_harian.json"

# ── Sumber FACEBOOK (Fase 4) ─────────────────────────────────
# Scraping langsung tidak viable. Impor export Meta Content Library (CSV/JSON).
facebook:
  enabled: false
  import_file: ""         # contoh: "data/fb_export.csv"

# ── Penjadwalan ──────────────────────────────────────────────
schedule:
  news_minutes: 30        # tarik berita tiap N menit
  x_minutes: 60           # tarik X tiap N menit
  ig_minutes: 120         # tarik Instagram tiap N menit

# ── Laporan otomatis ─────────────────────────────────────────
# Scheduler membuat laporan harian ke folder laporan/<tanggal>/.
laporan:
  enabled: false          # true = laporan dibuat otomatis tiap hari
  jam: "07:00"            # waktu lokal (Asia/Jakarta); ubah -> restart scheduler
  hari_terakhir: 1        # rentang data yang dilaporkan (1 = sehari terakhir)
  # Mengirim email TIDAK bisa ditarik kembali, jadi matikan secara bawaan.
  # Nyalakan hanya setelah secrets/email.yaml terisi dan penerima benar.
  email:
    enabled: false
    penerima: []          # mis. ["nama@kantor.co.id"]

# ── Penyimpanan ──────────────────────────────────────────────
storage:
  db_path: "data/monitoring.db"

# ── Analisis ─────────────────────────────────────────────────
sentiment:
  # "indobert" -> akurat (default), butuh transformers+torch. Otomatis fallback
  #               ke "lexicon" bila library tak ada.
  # "lexicon"  -> cepat, ringan, tanpa download model.
  engine: "indobert"
  # Folder model LOKAL. Kosong -> pakai models/indobert-sentiment (default).
  # Siapkan sekali:  python tools/setup_local_models.py
  # Setelah fine-tuning, arahkan ke: "models/indobert-sentiment-finetuned"
  # Model hasil fine-tuning lokal (21.000 data berlabel manusia). Terbukti lebih baik dari
  # mdhugol: akurasi 0.546 -> 0.750 (McNemar p~3e-64), setara di domain lain (p=0.79).
  # Kosongkan ("") untuk kembali ke model bawaan mdhugol. Folder ini tidak ada di repo
  # (di-.gitignore); bila tidak ditemukan, otomatis memakai mdhugol + peringatan.
  model_dir: "models/indobert-sentiment-finetuned"
  # path opsional ke lexicon InSet (positive.tsv / negative.tsv). Kosong -> pakai bawaan kecil.
  inset_dir: ""

# ── Kamus lokal yang bisa kamu edit (folder resources/) ──────
#   resources/kata_dasar_custom.txt  -> kata dasar tambahan untuk Sastrawi
#   resources/slang_baku.csv         -> normalisasi slang -> kata baku
#   resources/stopwords_custom.txt   -> stopword tambahan
# Perubahan berlaku langsung tanpa perlu melatih apa pun.
